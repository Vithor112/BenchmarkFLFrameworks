scrape_configs:
- job_name: cadvisor
  scrape_interval: 5s
  static_configs:
  - targets:
    - cadvisor:8080
- job_name: 'dcgm_exporter'
  scrape_interval: 5s
  static_configs:
    - targets: ['dcgm_exporter:9400']
- job_name: 'nvflare_clients'
  scrape_interval: 5s
  static_configs:
    - targets: ['server:18000']